<script>
const $=s=>document.querySelector(s),dlg=$('#dlg'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sv=(i,c='')=>`<svg class="icon ${c}"><use href="#i-${i}"/></svg>`;
const fmt=d=>d?new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Jakarta'})+' WIB':'-';
const toast=t=>{const e=$('#dt');e.textContent=t;e.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove('on'),2400)};
const LK={m:'https://drive.google.com/drive/folders/1AmQvrqtKZ5GD_TvkCW9aId20lagPufvQ?usp=sharing',b:'https://play.blooket.com/play',k:'https://drive.google.com/drive/folders/1Ac4qtHwp29A3ULBYimJ8MGYmxrssGTFd?usp=sharing',v:'https://youtu.be/TxuysbLRnEk'};
const PR=[['iso-9001','01','ISO 9001','ISO 9001: 2015','Sistem Manajemen Mutu','Fokus pada kualitas proses dan kepuasan pelanggan.','Pelatihan ini membahas persyaratan sistem manajemen mutu, penerapannya pada proses kerja, serta cara mengevaluasi pemenuhan persyaratan secara berkala.','blue'],
['iso-14001','02','ISO 14001','ISO 14001: 2015','Sistem Manajemen Lingkungan','Pahami pengelolaan dampak lingkungan.','Pelatihan ini membahas pengelolaan aspek dan dampak lingkungan, kewajiban kepatuhan, serta penerapan sistem manajemen lingkungan di organisasi.','teal'],
['iso-45001','03','ISO 45001','ISO 45001: 2018','Kesehatan & Keselamatan Kerja','Bangun lingkungan kerja yang lebih aman.','Pelatihan ini membahas identifikasi bahaya, penilaian risiko, dan pengendalian operasional untuk membangun lingkungan kerja yang lebih aman.','navy'],
['iso-37001','04','ISO 37001','ISO 37001: 2025','Sistem Manajemen Anti Penyuapan','Kenali pendekatan pencegahan penyuapan.','Pelatihan ini membekali peserta dengan pemahaman Sistem Manajemen Anti Penyuapan (SMAP) berdasarkan ISO 37001, mulai dari konteks organisasi dan penilaian risiko penyuapan hingga pelaksanaan audit internal dan pencatatan temuan.','navy']].map(p=>({slug:p[0],code:p[1],title:p[2],full:p[3],sub:p[4],sum:p[5],desc:p[6],tone:p[7]}));
const CR=[['Kebijakan anti penyuapan ditetapkan dan dikomunikasikan.','ISO 37001 klausul 5.2'],['Penilaian risiko penyuapan dilakukan secara berkala.','ISO 37001 klausul 4.5'],['Due diligence dilakukan terhadap mitra bisnis.','ISO 37001 klausul 8.2'],['Pemberian dan penerimaan hadiah tercatat.','ISO 37001 klausul 8.7'],['Saluran pelaporan dugaan penyuapan tersedia.','ISO 37001 klausul 8.9']];
const QB={PRE:[['Apa kepanjangan siklus PDCA?',['Plan-Do-Check-Act','Prepare-Draft-Correct-Approve','Plan-Deliver-Control-Audit','Predict-Do-Confirm-Act'],0],['Tujuan utama audit internal adalah...',['Mencari kesalahan individu','Menilai kesesuaian sistem terhadap persyaratan','Menggantikan audit eksternal','Menentukan gaji karyawan'],1],['Tindakan korektif dilakukan untuk...',['Menghilangkan penyebab ketidaksesuaian','Menutupi temuan','Menambah dokumen','Mengganti auditor'],0]],
POST:[['Dokumen terdokumentasi harus...',['Dihapus setelah dipakai','Terkendali dan mudah diakses','Hanya disimpan manajer','Selalu dicetak'],1],['Peran kepemimpinan dalam sistem manajemen adalah...',['Menyerahkan semua ke auditor','Menunjukkan komitmen dan mengarahkan sistem','Hanya menandatangani laporan','Tidak diperlukan'],1],['Pendekatan berbasis risiko berarti...',['Menghindari semua risiko','Mengidentifikasi dan menangani risiko dan peluang','Menunda perencanaan','Menghapus prosedur'],1]]};
const TL={SILABUS:'Silabus',MATERI:'Materi',STUDI_KASUS:'Studi kasus',VIDEO:'Video referensi',BLOOKET:'Blooket',LINK_LAIN:'Tautan lain'};
const SL={DRAFT:'Draf',ACTIVE:'Aktif',CLOSED:'Ditutup'},VL={DRAFT:'Draf',PUBLISHED:'Diterbitkan',RETIRED:'Dipensiunkan'},CL={MAJOR:'Major',MINOR:'Minor',OBSERVASI:'Observasi'};
let S,T=null,uid=100;
function seed(){const s={role:null,flash:'',me:null,
 departments:['IT','HCGA','Keuangan','Procurement'].map((n,i)=>({id:i+1,name:n})),
 standards:[{id:1,code:'ISO37001',name:'Sistem Manajemen Anti Penyuapan'}],
 versions:[{id:1,standardId:1,standardCode:'ISO37001',versionLabel:'v1',status:'PUBLISHED',itemCount:5},{id:2,standardId:1,standardCode:'ISO37001',versionLabel:'v2',status:'DRAFT',itemCount:0}],
 sessions:[{id:1,title:'UAT Audit Internal ISO 37001',standardCode:'ISO37001',versionLabel:'v1',status:'ACTIVE',expiresAt:'2026-11-30T17:00:00+07:00',auditorCount:2,assignmentCount:2},{id:2,title:'Audit Internal Semester II',standardCode:'ISO37001',versionLabel:'v1',status:'DRAFT',expiresAt:'2026-12-20T17:00:00+07:00',auditorCount:0,assignmentCount:0}],
 rooms:[{id:1,name:'Kebijakan Anti Penyuapan',description:'SOP kebijakan dan komitmen manajemen.',sortOrder:0,pub:true},{id:2,name:'Pengadaan & Mitra Bisnis',description:'',sortOrder:10,pub:false}],
 docs:[{id:1,code:'SOP-HCGA-001',title:'Prosedur Pemberian dan Penerimaan Hadiah',room:1,dept:2,pdf:'https://drive.google.com/drive/folders/1AmQvrqtKZ5GD_TvkCW9aId20lagPufvQ',pub:true},{id:2,code:'SOP-PRC-002',title:'Due Diligence Mitra Bisnis',room:2,dept:4,pdf:'',pub:false}],
 res:[{id:1,slug:'iso-37001',m:1,type:'VIDEO',title:'Video pengantar ISO 37001',description:'Pengantar SMAP.',url:LK.v,pub:true},{id:2,slug:'iso-9001',m:1,type:'BLOOKET',title:'Kuis Blooket ISO 9001',description:'',url:LK.b,pub:true},{id:3,slug:'iso-14001',m:2,type:'STUDI_KASUS',title:'Studi kasus ISO 14001',description:'',url:LK.k,pub:false}],
 tests:[],questions:[],ans:{},findings:[{id:1,aid:1,seq:1,classification:'MINOR',problem:'Penilaian risiko penyuapan belum diperbarui sejak 2025.',location:'IT',evidence:'Register risiko terakhir diperbarui Juni 2025.',reference:'ISO 37001 klausul 4.5',status:'OPEN',fu:{}}],
 assign:[{id:1,dept:'IT'},{id:2,dept:'HCGA'}]};
 PR.forEach(p=>[1,2].forEach(m=>['PRE','POST'].forEach(k=>{const t={id:'t'+p.slug+m+k,slug:p.slug,m,type:k,title:`${k=='PRE'?'Pre':'Post'}-test ${p.title} Pertemuan ${m}`,active:true,attempts:0};s.tests.push(t);QB[k].forEach((q,i)=>s.questions.push({id:t.id+i,tid:t.id,text:q[0],opts:q[1],ans:q[2],active:true,count:0}))})));
 s.assign.forEach(a=>{s.ans[a.id]=CR.map((c,i)=>({id:a.id*10+i,criteria:c[0],reference:c[1],result:null,note:'',evidence:'',answerId:null}))});
 s.ans[1][0].result='YA';s.ans[1][0].answerId=10;s.ans[1][1].result='TIDAK';s.ans[1][1].answerId=11;s.ans[1][1].note='Belum ada pembaruan risiko 2026.';
 return s}
S=seed();
const prog=slug=>PR.find(p=>p.slug==slug);
/* ---------- ikon peserta ---------- */
const PDF=`<svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#fff" stroke="#e53b2f" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h5" fill="none" stroke="#e53b2f" stroke-width="2" stroke-linejoin="round"/><rect x="0.8" y="11.5" width="16.4" height="7.5" rx="1.6" fill="#e53b2f"/><text x="9" y="17.2" font-size="5.2" font-weight="700" fill="#fff" text-anchor="middle" font-family="Inter, Arial, sans-serif">PDF</text></svg>`;
const DOC=`<svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#fff" stroke="#5b83d6" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h5" fill="none" stroke="#5b83d6" stroke-width="2" stroke-linejoin="round"/><g fill="#5b83d6"><rect x="7" y="10.5" width="2" height="2" rx="0.4"/><rect x="7" y="14" width="2" height="2" rx="0.4"/><rect x="7" y="17.5" width="2" height="2" rx="0.4"/><rect x="10.5" y="10.9" width="6" height="1.4" rx="0.7"/><rect x="10.5" y="14.4" width="6" height="1.4" rx="0.7"/><rect x="10.5" y="17.9" width="6" height="1.4" rx="0.7"/></g></svg>`;
const LNK=`<svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4ab81e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>`;
const USR=`<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" class="meta-icon"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>`;
const CLS=`<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
/* ---------- peserta ---------- */
const pcard=p=>`<li class="pcard"><span class="pbadge tone-${p.tone}">${p.code}</span><h3>${esc(p.title)}</h3><p class="pcard-sub">${esc(p.sub)}</p><p class="pcard-desc">${esc(p.sum)}</p><a href="#/program/${p.slug}" class="pcard-link">Lihat detail <span aria-hidden="true">→</span></a></li>`;
const pHeader=p=>`<header class="site-header"><div class="container header-row"><a href="#/" class="brand">SOPINSYA</a><nav aria-label="Menu utama" class="nav"><a href="#/program" class="${p=='/'||p.startsWith('/program')?'active':''}">Program</a><a href="#/tentang-kami" class="${p.startsWith('/tentang')?'active':''}">Tentang Kami</a><a href="#/tentang-kami/kontak" class="pill">Hubungi Kami</a></nav></div></header>`;
const pFooter=`<footer class="site-footer"><div class="container footer-grid"><p class="footer-brand">SOPINSYA</p><div><h2>Tentang Kami</h2><ul><li><a href="#/tentang-kami/profil">Profil Sopinsya</a></li><li><a href="#/tentang-kami/visi-misi">Visi &amp; Misi</a></li><li><a href="#/tentang-kami/tim">Tim Kami</a></li></ul></div><div><h2>Menu Utama</h2><ul><li><a href="#/program">Program</a></li><li><a href="#/tentang-kami/kontak">Hubungi Kami</a></li><li><a href="#/masuk">Masuk Internal (demo)</a></li></ul></div></div></footer>`;
function pHome(){return `<section class="hero-band"><div class="container hero-grid"><div><p class="eyebrow">PLATFORM PEMBELAJARAN &amp; PELATIHAN</p><h1>Tingkatkan kompetensi<br>melalui pelatihan standar ISO</h1><p class="hero-lead">Pelajari standar, pahami penerapannya, dan ikuti evaluasi pembelajaran dalam satu platform yang praktis.</p><a href="#/program" class="btn btn-primary">Jelajahi Program</a></div><div class="hero-card-outer" aria-hidden="true"><div class="hero-card"><p class="hero-card-eyebrow">SOPINSYA LEARNING</p><p class="hero-card-title">Belajar terarah.<br>Kompetensi meningkat.</p><span class="chip">ISO • SMK3 • Risk</span></div></div></div></section><section id="program" class="container section program-catalog"><p class="eyebrow">PILIH PELATIHAN</p><h2 class="section-title">Program Pelatihan</h2><p class="catalog-intro">Pilih program untuk melihat silabus, materi, studi kasus, dan evaluasi pembelajaran.</p><ul class="pgrid" aria-label="Daftar program pelatihan">${PR.map(pcard).join('')}</ul></section>`}
function pAbout(){const ph='<p class="note">Konten akan diisi oleh penyelenggara.</p>';return `<div class="container about"><h1>Tentang Kami</h1><section id="profil"><h2>Profil Sopinsya</h2>${ph}</section><section id="visi-misi"><h2>Visi &amp; Misi</h2>${ph}</section><section id="tim"><h2>Tim Kami</h2>${ph}</section><section id="kontak"><h2>Hubungi Kami</h2><p class="note">Kontak belum diisi.</p></section></div>`}
function pDetail(slug){const p=prog(slug);if(!p)return '<div class="container section"><h1>Program tidak ditemukan</h1></div>';
 const ms=[1,2],lst=(rs)=>`<ul class="content-resource-list">${rs.map(r=>`<li>${r.url?`<a class="row" href="${r.url}" target="_blank" rel="noopener noreferrer">${r.icon}<span>${esc(r.label)}</span><span class="resource-action">Buka ↗</span></a>`:`<div class="row row-disabled" aria-disabled="true">${r.icon}<span>${esc(r.label)}</span><small>Belum tersedia</small></div>`}</li>`).join('')}</ul>`;
 const per=(t,u,i)=>lst(ms.map(m=>({label:`${t} ${p.title} — Pertemuan ${m}`,url:u,icon:i})));
 const extra=S.res.filter(r=>r.slug==slug&&r.pub),ex=ty=>extra.filter(r=>r.type==ty).map(r=>({label:`${r.title} — Pertemuan ${r.m}`,url:r.url,icon:LNK}));
 const sec=(id,h,help,body,cls='')=>`<section id="${id}" class="content-section ${cls}"><h2>${h}</h2><p class="content-help">${help}</p>${body}</section>`;
 const tst=k=>`<ul class="content-resource-list">${ms.map(m=>`<li><button type="button" class="row" data-a="test" data-s="${slug}" data-m="${m}" data-k="${k}">${DOC}<span>${k=='PRE'?'Pre':'Post'}-test — Pertemuan ${m}</span><span class="resource-action">Mulai →</span></button></li>`).join('')}</ul>`;
 return `<main class="container detail"><div class="detail-top"><div class="illustration" role="img" aria-label="Ilustrasi program pelatihan" style="background-image:url(../apps/web/public/images/ilustrasi-program.svg)"></div><div><a href="#/program" class="back-link">← Semua Program</a><h1>${esc(p.full)}</h1><ul class="meta"><li>${USR} Trainer: Ahmad Fadillah</li></ul><p class="detail-desc">${esc(p.desc)}</p></div></div>
<nav class="program-outline" aria-label="Daftar bagian program">${[['silabus','Silabus'],['materi','Materi'],['studi-kasus','Studi Kasus'],['pre-test','Pre-test'],['post-test','Post-test'],['kuis','Kuis'],['video-referensi','Video'],['pustaka-sop','Pustaka SOP'],['ulasan','Rating &amp; Ulasan']].map(a=>`<a href="#/program/${slug}/${a[0]}">${a[1]}</a>`).join('')}</nav>
<div class="program-content">${sec('silabus','Silabus','Gambaran materi dan cakupan pembelajaran program.',lst([...ms.map(m=>({label:`Silabus ${p.full} — Pertemuan ${m}`,url:null,icon:PDF})),...ex('SILABUS')]))}
${sec('materi','Materi Pelatihan','Dokumen materi yang digunakan selama pelatihan.',lst([...ms.map(m=>({label:`Materi Pelatihan ${p.title} — Pertemuan ${m}`,url:LK.m,icon:PDF})),...ex('MATERI')]))}
${sec('studi-kasus','Studi Kasus','Latihan penerapan materi melalui studi kasus.',lst([...ms.map(m=>({label:`Studi Kasus ${p.title} — Pertemuan ${m}`,url:LK.k,icon:DOC})),...ex('STUDI_KASUS')]))}
${sec('pre-test','Pre-test','Ukur pemahaman awal sebelum mempelajari materi.',tst('PRE'))}${sec('post-test','Post-test','Evaluasi pemahaman setelah mempelajari materi.',tst('POST'))}
${sec('kuis','Kuis Interaktif','Perkuat pemahaman melalui kuis pelatihan.',lst([...ms.map(m=>({label:`Kuis — Pertemuan ${m}`,url:LK.b,icon:LNK})),...ex('BLOOKET')]))}
${sec('video-referensi','Video Referensi','Video pendukung untuk memperdalam pemahaman materi.',lst([...ms.map(m=>({label:`Video 1 — Pertemuan ${m}`,url:LK.v,icon:LNK})),...ex('VIDEO')]))}
${sec('pustaka-sop','Pustaka SOP','Referensi dokumen prosedur operasional standar terkait program.',per('Pustaka SOP',null,PDF).replace(/Pustaka SOP (ISO[^—]*)—/g,'Pustaka SOP $1—'))}
<section id="ulasan" class="content-section content-pending"><h2>Rating dan Ulasan</h2><p class="content-help">Fitur pengiriman rating dan ulasan belum tersedia pada implementasi saat ini.</p></section></div></main>`}
/* ---------- dialog tes ---------- */
function tdlg(){const p=prog(T.s),qs=T.qs,tot=qs.length,ans=qs.filter(q=>T.a[q.id]!==undefined).length,bl=tot-ans,done=T.ph=='done',st=dlg.querySelector('.dlg-body')?.scrollTop||0;
 const sub=done?`Anda berhasil menjawab <strong>${T.r.c}</strong> dari ${tot} pertanyaan dengan benar`:!tot?'':T.ph=='identity'?'Isi data diri untuk memulai':'Selamat mengerjakan';
 const kn=T.k=='PRE'?'Pre-test':'Post-test',n=done?tot:ans;
 dlg.className='dlg dlg-test'+(tot&&T.ph!='identity'?' dlg-tall':'');

 else if(tab=='materi')b+=`<h2>Konten pendukung (${S.res.length})</h2>`+tbl(['Program / Pertemuan','Jenis','Judul','Tautan','Status',''],S.res.map(r=>`<tr><td>${pl(r.slug)}<div class="muted small">Pertemuan ${r.m}</div></td><td>${TL[r.type]}</td><td><strong>${esc(r.title)}</strong>${r.description?`<div class="muted small">${esc(r.description)}</div>`:''}</td><td><a href="${r.url}" target="_blank" rel="noopener noreferrer">Buka tautan</a></td><td>${bd(r.pub)}</td><td><details><summary>Edit</summary>${frm('resEd',`<label>Judul<input name="title" required value="${esc(r.title)}"></label><label>URL https://<input type="url" name="url" required value="${esc(r.url)}"></label><button class="btn small" type="submit">Simpan perubahan</button>`,r.id,'compact-form')}</details> ${pubBtn('res',r.id,r.pub,'Tarik','Terbitkan')}</td></tr>`).join(''),6)+frm('resNew',`<h2>Tambah konten program</h2><label>Program</label><select name="slug">${opts(pg)}</select><label>Pertemuan</label><select name="m"><option value="1">Pertemuan 1</option><option value="2">Pertemuan 2</option></select><label>Jenis konten</label><select name="type">${opts(Object.entries(TL))}</select><label>Judul</label><input name="title" required placeholder="mis. Video pengantar ISO 37001"><label>URL https://</label><input type="url" name="url" required placeholder="https://..."><label><input type="checkbox" name="pub" value="1"> Langsung tampilkan ke peserta</label><p><button class="btn" type="submit">Simpan konten</button></p>`);
 else{const qn=t=>S.questions.filter(q=>q.tid==t.id&&q.active).length+'/'+S.questions.filter(q=>q.tid==t.id).length;
  b+=`<h2>Tes pelatihan (${S.tests.length})</h2>`+tbl(['Program / Pertemuan','Jenis tes','Judul','Soal aktif/total','Percobaan','Status',''],S.tests.map(t=>`<tr><td>${pl(t.slug)}<div class="muted small">Pertemuan ${t.m}</div></td><td>${t.type=='PRE'?'Pre-test':'Post-test'}</td><td>${t.title}</td><td>${qn(t)}</td><td>${t.attempts}</td><td>${bd(t.active,'Aktif','Nonaktif')}</td><td>${pubBtn('tst',t.id,t.active,'Nonaktifkan','Aktifkan')}</td></tr>`).join(''),7)+frm('tstNew',`<h2>Buat tes</h2><label>Program</label><select name="slug">${opts(pg)}</select><label>Pertemuan</label><select name="m"><option value="1">Pertemuan 1</option><option value="2">Pertemuan 2</option></select><label>Jenis tes</label><select name="type"><option value="PRE">Pre-test</option><option value="POST">Post-test</option></select><label>Judul tes</label><input name="title" required><p><button class="btn" type="submit">Simpan tes</button></p>`)+`<h2>Soal tes (${S.questions.length})</h2>`+tbl(['Tes','Pertanyaan','Jawaban tersimpan','Status',''],S.questions.slice(0,12).map(q=>`<tr><td>${esc(S.tests.find(t=>t.id==q.tid)?.title)}</td><td>${esc(q.text)}</td><td>${q.count}</td><td>${bd(q.active,'Aktif','Nonaktif')}</td><td>${pubBtn('q',q.id,q.active,'Nonaktifkan','Aktifkan')}</td></tr>`).join(''),5)+`<p class="muted small">Menampilkan 12 dari ${S.questions.length} soal.</p>`+frm('qNew',`<h2>Tambah soal</h2><label>Tes</label><select name="tid">${opts(S.tests.map(t=>[t.id,t.title]))}</select><label>Pertanyaan</label><textarea name="text" rows="3" required></textarea>${'ABCD'.split('').map(c=>`<label>Pilihan ${c}</label><input name="o${c}" ${c<'C'?'required':''}>`).join('')}<label>Kunci jawaban</label><select name="ans"><option>A</option><option>B</option><option>C</option><option>D</option></select><p><button class="btn" type="submit">Simpan soal</button></p>`)+`<div class="alert info">Kunci jawaban tetap berada di backend dan tidak dikirim melalui API publik peserta.</div>`}
 return b}
/* ---------- internal: Auditor ---------- */
const fnd=aid=>S.findings.filter(f=>f.aid==aid),code=f=>`T-1-${f.seq}`;
function uDash(){const rows=S.assign.map(a=>{const e=S.ans[a.id],an=e.filter(x=>x.result).length,f=fnd(a.id);return {a,tot:e.length,an,ya:e.filter(x=>x.result=='YA').length,ti:e.filter(x=>x.result=='TIDAK').length,fo:f.filter(x=>x.status=='OPEN').length,ft:f.length,fc:f.filter(x=>x.status!='OPEN').length}}),t=k=>rows.reduce((s,r)=>s+r[k],0),pc=(a,b)=>b?Math.round(a/b*100):0,cn=c=>S.findings.filter(f=>f.classification==c).length;
 return `<h1>Dashboard Audit</h1>${flash()}<p class="muted">Batas waktu pengisian: <strong>${fmt(S.sessions[0].expiresAt)}</strong></p><div class="grid"><div class="card"><div class="muted">Kemajuan pengisian</div><div class="stat">${pc(t('an'),t('tot'))}%</div><progress max="100" value="${pc(t('an'),t('tot'))}"></progress><div class="muted small">${t('an')} dari ${t('tot')} poin terjawab</div></div><div class="card"><div class="muted">Kesesuaian (YA dari yang terjawab)</div><div class="stat">${pc(t('ya'),t('an'))}%</div><progress max="100" value="${pc(t('ya'),t('an'))}"></progress><div class="muted small">YA: ${t('ya')} · TIDAK: ${t('ti')}</div></div><div class="card"><div class="muted">Temuan</div><div class="stat">${S.findings.length}</div><div class="small"><span class="badge major">Major ${cn('MAJOR')}</span> <span class="badge minor">Minor ${cn('MINOR')}</span> <span class="badge observasi">Observasi ${cn('OBSERVASI')}</span></div><div class="muted small">Terbuka: ${t('fo')} · Ditutup: ${t('fc')}</div></div></div><h2>Per unit yang diaudit</h2>${tbl(['Unit','Pengisian','YA','TIDAK','Belum','Temuan (terbuka/total)',''],rows.map(r=>`<tr><td><strong>${r.a.dept}</strong></td><td>${pc(r.an,r.tot)}% <span class="muted small">(${r.an}/${r.tot})</span></td><td>${r.ya}</td><td>${r.ti}</td><td>${r.tot-r.an}</td><td>${r.fo}/${r.ft}</td><td class="nowrap"><a class="btn small" href="#/auditor/penugasan/${r.a.id}">Checklist</a> <a class="btn small secondary" href="#/auditor/penugasan/${r.a.id}/temuan">Temuan</a> <a class="btn small secondary" href="#/auditor/penugasan/${r.a.id}/laporan">Laporan</a></td></tr>`).join(''),7)}`}
const tabs=(id,t)=>`<div class="tabs no-print" role="navigation" aria-label="Bagian unit"><a href="#/auditor/penugasan/${id}"${t=='c'?' class="active" aria-current="page"':''}>${sv('checklist','sm')}Checklist &amp; Kertas Kerja</a><a href="#/auditor/penugasan/${id}/temuan"${t=='t'?' class="active" aria-current="page"':''}>${sv('alert','sm')}Register Temuan${fnd(id).length?` <span class="count">${fnd(id).length}</span>`:''}</a><a href="#/auditor/penugasan/${id}/laporan"${t=='l'?' class="active" aria-current="page"':''}>${sv('file','sm')}Laporan</a></div>`;
function uCheck(id){const a=S.assign.find(x=>x.id==id),e=S.ans[id];return `<p><a href="#/auditor">&larr; Dashboard</a></p><h1>Checklist Audit: ${a.dept}</h1>${flash()}${tabs(id,'c')}<form data-f="ans" data-id="${id}" class="card">${e.map((x,i)=>`<div class="item"><div class="muted small">Poin #${i+1} · ${x.reference}</div><div><strong>${x.criteria}</strong></div><div class="choices" role="radiogroup">${[['YA','YA'],['TIDAK','TIDAK'],['','Belum dijawab']].map(o=>`<label><input type="radio" name="r${x.id}" value="${o[0]}" ${(x.result||'')==o[0]?'checked':''}> ${o[1]}</label>`).join('')}</div><label for="n${x.id}">Catatan / bukti objektif</label><textarea id="n${x.id}" name="n${x.id}">${esc(x.note)}</textarea><label for="e${x.id}">Tautan bukti (opsional, https://)</label><input id="e${x.id}" type="url" name="e${x.id}" value="${esc(x.evidence)}">${x.result=='TIDAK'?`<p><a class="btn small secondary" href="#/auditor/penugasan/${id}/temuan">Catat temuan untuk poin ini</a></p>`:''}</div>`).join('')}<div class="sticky"><button class="btn" type="submit">Simpan semua jawaban</button></div></form>`}
const fu=(f,k,l,ph)=>`<fieldset><legend>${l}</legend><label>Uraian</label><textarea name="${k}">${esc(f.fu[k]||'')}</textarea><div class="grid"><div><label>Pelaksana (PIC)</label><input name="${k}Pic" value="${esc(f.fu[k+'Pic']||'')}"></div><div><label>Target selesai</label><input name="${k}Target" value="${esc(f.fu[k+'Target']||'')}" placeholder="${ph}"></div></div></fieldset>`;
function uTemuan(id){const a=S.assign.find(x=>x.id==id),fs=fnd(id);return `<p><a href="#/auditor">&larr; Dashboard</a> · <a href="#/auditor/penugasan/${id}">Checklist unit ini</a></p><h1>Register Temuan: ${a.dept}</h1>${flash()}${tabs(id,'t')}<h2>Daftar temuan</h2>${fs.length?tbl(['Kode','Klasifikasi','Masalah','Lokasi','Status',''],fs.map(f=>`<tr><td class="nowrap"><strong>${code(f)}</strong></td><td><span class="badge ${f.classification.toLowerCase()}">${CL[f.classification]}</span></td><td>${esc(f.problem)}<div class="muted small">Bukti: ${esc(f.evidence)}</div><div class="muted small">Rujukan: ${esc(f.reference)}</div></td><td>${esc(f.location)}</td><td><span class="badge ${f.status.toLowerCase()}">${f.status=='OPEN'?'Terbuka':'Ditutup'}</span></td><td>${f.status=='OPEN'?`<button class="btn small secondary" data-a="tutup" data-id="${f.id}">Tutup temuan</button>`:''}</td></tr>`).join(''),6):'<div class="card muted">Belum ada temuan untuk unit ini.</div>'}
${fs.length?`<h2>Tindak lanjut temuan</h2>`+fs.map(f=>`<details class="card"><summary><strong>${code(f)}</strong> <span class="badge ${f.classification.toLowerCase()}">${CL[f.classification]}</span> <span class="muted small">${esc(f.problem.slice(0,90))}</span></summary>${frm('fu',(f.classification=='OBSERVASI'?`<p class="muted small">Observasi cukup tindakan peningkatan.</p>${fu(f,'improvementAction','Rencana tindakan peningkatan','Desember 2026')}`:`<label>Akar penyebab</label><textarea name="rootCause">${esc(f.fu.rootCause||'')}</textarea>${fu(f,'correction','Perbaikan / koreksi (tindakan langsung)','Desember 2026')}${fu(f,'correctiveAction','Tindakan korektif (mencegah berulang)','Januari 2027')}`)+'<p><button class="btn" type="submit">Simpan tindak lanjut</button></p>',f.id,'')}</details>`).join(''):''}
<h2>Catat temuan baru</h2>${frm('tmNew',`<label>Klasifikasi</label><select name="classification" required><option value="">Pilih...</option><option value="MAJOR">Major: SOP tidak ada atau sama sekali tidak dikerjakan</option><option value="MINOR">Minor: dikerjakan tetapi tidak konsisten/tidak rutin</option><option value="OBSERVASI">Observasi: sudah dikerjakan, dapat dioptimalkan</option></select><label>Masalah (Problem)</label><textarea name="problem" required></textarea><label>Lokasi (Location)</label><input name="location" required value="${a.dept}"><label>Bukti objektif (Objective Evidence)</label><textarea name="evidence" required></textarea><label>Rujukan (Reference), mis. klausul atau nomor SOP</label><input name="reference" required><p><button class="btn" type="submit">Simpan temuan</button></p>`,id)}`}
function uLap(id){const a=S.assign.find(x=>x.id==id),fs=fnd(id);return `<p><a href="#/auditor">&larr; Dashboard</a></p><h1>Laporan Ketidaksesuaian: ${a.dept}</h1>${tabs(id,'l')}<div class="card"><p class="muted small">Dicetak ${fmt(new Date())} oleh Auditor Demo · ${fs.length} temuan</p>${fs.length?tbl(['Kode','Klasifikasi','Masalah','Akar penyebab','Status'],fs.map(f=>`<tr><td>${code(f)}</td><td>${CL[f.classification]}</td><td>${esc(f.problem)}</td><td>${esc(f.fu.rootCause||'-')}</td><td>${f.status=='OPEN'?'Terbuka':'Ditutup'}</td></tr>`).join(''),5):'<p class="muted">Belum ada temuan.</p>'}<p><button class="btn secondary" onclick="print()">Cetak</button></p></div>`}
function uSop(id){const rs=S.rooms.filter(r=>r.pub),r=S.rooms.find(x=>x.id==id&&x.pub);
 if(r)return `<p><a href="#/auditor/sop">&larr; Semua Program</a></p><h1>${esc(r.name)}</h1><p>${esc(r.description)}</p>${tbl(['Kode','Judul',''],S.docs.filter(d=>d.room==r.id&&d.pub).map(d=>`<tr><td class="nowrap">${d.code}</td><td>${esc(d.title)}</td><td>${d.pdf?`<a class="btn small" href="${d.pdf}" target="_blank" rel="noopener noreferrer">Buka PDF</a>`:'<span class="muted small">Tautan belum tersedia</span>'}</td></tr>`).join(''),3)}`;
 return `<h1>Pustaka SOP</h1>${rs.length?`<div class="grid">${rs.map(r=>`<a class="card" href="#/auditor/sop/${r.id}"><strong>${esc(r.name)}</strong><p class="muted small">${esc(r.description)}</p><span class="muted small">${S.docs.filter(d=>d.room==r.id&&d.pub).length} dokumen</span></a>`).join('')}</div>`:'<div class="card muted">Belum ada Program yang dipublikasikan.</div>'}`}
/* ---------- router ---------- */
function render(){const r=(location.hash.slice(1)||'/').split('/').filter(Boolean),p='/'+r.join('/'),app=$('#app');let h,cls='';
 const A=r[0]=='admin',U=r[0]=='auditor';
 if((A&&S.role!='admin')||(U&&S.role!='auditor')){location.hash='/masuk';return}
 if(r[0]=='masuk'||r[0]=='login'){if(S.role){location.hash='/'+S.role;return}cls='gate';h=gate(S.err,S.em);S.err='';}
 else if(A){cls='role-admin';const n=r[1]||'dashboard';h=n=='dashboard'?lay(n,'Dashboard',aDash()):n=='sesi'?lay(n,'Sesi Audit',r[2]?aSesiD(r[2]):aSesi()):n=='checklist'?lay(n,'Master Checklist',aCheck()):n=='departemen'?lay(n,'Departemen',aDept()):n=='sop'?lay(n,'Pustaka SOP',aSop()):n=='program-training'?lay(n,'Program Training',aTrain(r[2])):lay('','Tidak ditemukan','<h1>Halaman tidak ditemukan</h1>')}
 else if(U){cls='role-auditor';const id=r[2]&&+r[2];h=r[1]=='sop'?lay('sop','Pustaka SOP',uSop(r[2])):r[1]=='penugasan'&&S.assign.find(a=>a.id==id)?lay('dashboard',r[3]=='temuan'?'Register Temuan':r[3]=='laporan'?'Laporan':'Checklist',r[3]=='temuan'?uTemuan(id):r[3]=='laporan'?uLap(id):uCheck(id),id):lay('dashboard','Dashboard Audit',uDash())}
 else{h=pHeader(p)+'<main id="konten">'+(r[0]=='program'&&r[1]?pDetail(r[1]):r[0]=='tentang-kami'?pAbout():pHome())+'</main>'+pFooter}
 document.body.className=cls;$('#cssW').disabled=!!(cls);$('#cssA').disabled=!cls;app.innerHTML=h}
function go(){render();const r=(location.hash.slice(1)||'/').split('/').filter(Boolean),id=r[0]=='program'?(r[1]?r[2]:'program'):r[0]=='tentang-kami'?r[1]:'';const el=id&&document.getElementById(id);el?el.scrollIntoView():scrollTo(0,0)}
addEventListener('hashchange',go);

const ok=m=>{S.flash=m;render()};
const H={
 login(d){const em=d.email.trim().toLowerCase(),role=em=='admin@sopinsya'?'admin':em=='auditor@sopinsya'?'auditor':null;if(!role||d.secret!='demo123'){S.err='Email atau kata sandi tidak sesuai.';S.em=em;render();return}S.role=role;S.err='';location.hash='/'+role},
 tstart(d){T.n=d.n;T.i=d.i;if(!d.n.trim()||!d.i.trim()){T.e='Nama dan instansi wajib diisi.';tdlg();return}T.e='';S.me={n:d.n.trim(),i:d.i.trim()};T.ph='working';tdlg()},
 sesiNew(d){const v=S.versions.find(x=>x.id==d.vid);S.sessions.unshift({id:++uid,title:d.title,standardCode:v.standardCode,versionLabel:v.versionLabel,status:'DRAFT',expiresAt:new Date(d.exp).toISOString(),auditorCount:0,assignmentCount:0});ok('Tersimpan.')},
 std(d){S.standards.push({id:++uid,code:d.code,name:d.name});ok('Tersimpan.')},
 ver(d){const s=S.standards.find(x=>x.id==d.sid);S.versions.push({id:++uid,standardId:s.id,standardCode:s.code,versionLabel:d.vl,status:'DRAFT',itemCount:0});ok('Tersimpan.')},
 dept(d){S.departments.push({id:S.departments.length+1,name:d.name});ok('Tersimpan.')},
 room(d){S.rooms.push({id:++uid,name:d.name,description:d.description,sortOrder:S.rooms.length*10,pub:!!d.pub});ok('Tersimpan.')},
 doc(d){S.docs.push({id:++uid,code:d.code,title:d.title,room:+d.room,dept:+d.dept||null,pdf:d.pdf,pub:!!d.pub});ok('Tersimpan.')},
 resNew(d){S.res.push({id:++uid,slug:d.slug,m:+d.m,type:d.type,title:d.title,description:'',url:d.url,pub:!!d.pub});ok('Perubahan berhasil disimpan.')},
 resEd(d,f){Object.assign(S.res.find(x=>x.id==f.dataset.id),{title:d.title,url:d.url});ok('Perubahan berhasil disimpan.')},
 tstNew(d){S.tests.push({id:'t'+(++uid),slug:d.slug,m:+d.m,type:d.type,title:d.title,active:true,attempts:0});ok('Perubahan berhasil disimpan.')},
 qNew(d){S.questions.push({id:'q'+(++uid),tid:d.tid,text:d.text,opts:[d.oA,d.oB,d.oC||'-',d.oD||'-'],ans:'ABCD'.indexOf(d.ans),active:true,count:0});ok('Perubahan berhasil disimpan.')},
 ans(d,f){let n=0;S.ans[f.dataset.id].forEach(x=>{const r=d['r'+x.id]||null,no=d['n'+x.id]||'',ev=d['e'+x.id]||'';if(r!=x.result||no!=x.note||ev!=x.evidence){Object.assign(x,{result:r,note:no,evidence:ev,answerId:r?x.id:null});n++}});S.flash=`Tersimpan. ${n} poin diperbarui.`;render()},
 tmNew(d,f){const id=+f.dataset.id;S.findings.push({id:++uid,aid:id,seq:S.findings.length+1,classification:d.classification,problem:d.problem,location:d.location,evidence:d.evidence,reference:d.reference,status:'OPEN',fu:{}});ok('Temuan tersimpan.')},
 fu(d,f){S.findings.find(x=>x.id==f.dataset.id).fu=d;ok('Tindak lanjut temuan tersimpan.')}};
document.addEventListener('submit',e=>{const f=e.target,n=f.dataset.f;if(!n)return;e.preventDefault();H[n](Object.fromEntries(new FormData(f)),f)});
document.addEventListener('change',e=>{const t=e.target;if(T&&t.dataset.q){T.a[t.dataset.q]=+t.dataset.o;T.bl=false;tdlg()}});
dlg.addEventListener('close',()=>{T=null});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const d=el.dataset,a=d.a;
 if(a=='test')openTest(d.s,d.m,d.k);else if(a=='close')dlg.close();
 else if(a=='finish'){T.qs.length-T.qs.filter(q=>T.a[q.id]!==undefined).length>0?(T.bl=true,tdlg()):grade()}
 else if(a=='grade')grade();else if(a=='back'){T.bl=false;tdlg()}else if(a=='treset'){T.a={};T.bl=false;tdlg()}
 else if(a=='again'){T.a={};T.r=null;T.ph='working';tdlg()}
 else if(a=='logout'){S.role=null;location.hash='/masuk'}
 else if(a=='reset'){S=seed();toast('Data demo direset');location.hash='/';render()}
 else if(a=='info'){e.preventDefault();toast('Halaman detail ini tidak disertakan di demo')}
 else if(a=='ses'){S.sessions.find(x=>x.id==d.id).status=d.v;ok('Tersimpan.')}
 else if(a=='tutup'){S.findings.find(x=>x.id==d.id).status='CLOSED';ok('Temuan ditutup.')}
 else if(a=='pub'){const L={room:S.rooms,doc:S.docs,res:S.res,tst:S.tests,q:S.questions}[d.k],x=L.find(i=>i.id==d.id);if(d.k=='tst'||d.k=='q')x.active=!x.active;else x.pub=!x.pub;ok('Tersimpan.')}});
go();
